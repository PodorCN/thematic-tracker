name: Macro Pages Daily

on:
  schedule:
    # 09:10 Toronto during daylight time, 08:10 during standard time.
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Toronto snapshot date (YYYY-MM-DD), defaults to today"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Toronto date
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=America/Toronto date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # This job is a DATA publisher only. A template change is never part of it.
      - name: Check frozen frontend before fetching
        run: python scripts/econ/verify_data_only_changes.py --product economic-calendar --staged

      - name: Fetch and publish economic calendar JSON
        run: |
          python scripts/econ/fetch_calendar.py --date "${{ steps.vars.outputs.date }}" --days 7 --countries US,CA,EMU,DE,FR,IT,ES,UK,CH --impacts HIGH,MEDIUM --with-history --history-events 15 --history-limit 12
          python scripts/econ/render_calendar.py --date "${{ steps.vars.outputs.date }}"
          git diff --exit-code HEAD -- economic-calendar/index.html economic-calendar/archive/
          python -m pytest tests/test_econ_render.py tests/test_data_only_release.py -q

      # Fed/BOC requires a separately written independent PM verdict and never runs here.
      - name: Commit only calendar data
        run: |
          git config user.name "macro-pages-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "economic-calendar/raw/${{ steps.vars.outputs.date }}/economic_calendar.json" \
            economic-calendar/data/latest.json economic-calendar/data/dates.json \
            "economic-calendar/data/archive/${{ steps.vars.outputs.date }}.json"
          python scripts/econ/verify_data_only_changes.py --product economic-calendar --staged
          if git diff --cached --quiet; then
            echo "No new calendar snapshot; skipping commit"
          else
            git commit -m "data(economic-calendar): snapshot ${{ steps.vars.outputs.date }}"
            python scripts/econ/verify_data_only_changes.py --product economic-calendar --range HEAD^..HEAD
            git push origin HEAD:main
          fi
