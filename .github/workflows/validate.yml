name: validate theme
on:
  push:
    paths:
      - 'canadian-banks/theme.md'
      - 'ai-software/theme.md'
      - 'scripts/validate-theme.mjs'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'canadian-banks/theme.md'
      - 'ai-software/theme.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-theme.mjs canadian-banks/theme.md
      - run: node scripts/validate-theme.mjs ai-software/theme.md
