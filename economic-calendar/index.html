<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Economic Calendar | PodorM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
<style>
  /* Nocturne theme */
  :root {
    --color-bg: #0f101c;
    --color-bg-2: #161826;
    --color-card: #232532;
    --color-text: #e9e9ed;
    --color-accent: #9184d9;
    --color-accent-300: #d2cefd;
    --color-accent-400: #b5abfc;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-300: #cfd3e5;
    --color-neutral-400: #b2b6ca;
    --color-neutral-500: #9397ab;
    --color-neutral-600: #75798c;
    --color-neutral-800: #3f424d;
    --font-heading: "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 0 0 1px #3f424d;
    --high: #e85d5d;
    --medium: #e8a54a;
    --low: #7a8a9a;
  }
  * , *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:15px; line-height:1.55; }
  a { color:var(--color-neutral-300); text-decoration:none; transition:color .18s ease; }
  a:hover { color:var(--color-accent); }
  /* header — PodorM */
  .site-header {
    position: fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 56px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--color-neutral-400);
    background: linear-gradient(to bottom, rgba(15,16,28,.92), rgba(15,16,28,0));
    backdrop-filter: blur(6px);
  }
  .site-header .brand { color:var(--color-text); }
  .site-header nav { display:flex; gap:36px; }
  /* sections — PodorM */
  .section { padding:120px 56px; display:flex; flex-direction:column; gap:44px; border-top:1px solid var(--color-neutral-800); }
  .section.tinted { background: linear-gradient(180deg, #12131f, #0f101c); }
  [hidden] { display:none !important; }
  .section-head { display:flex; flex-direction:column; gap:14px; }
  .section-head h2 { margin:0; font-family:var(--font-heading); font-weight:500; font-size:44px; letter-spacing:-.01em; }
  .rule-fade { width:520px; max-width:100%; height:1px; background: linear-gradient(to right, var(--color-neutral-600), transparent); }
  .caption { font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--color-neutral-500); }
  .snapshot-control { display:flex; align-items:center; gap:10px; width:max-content; max-width:100%; margin-top:4px; padding:8px 10px; border:1px solid var(--color-neutral-800); border-radius:var(--radius-md); background:var(--color-card); }
  .snapshot-control label { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--color-neutral-500); white-space:nowrap; }
  /* cards — PodorM */
  .card { background:var(--color-card); border-radius:var(--radius-md); padding:14px; }
  .elev-sm { box-shadow: var(--shadow-sm); }
  .charts-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; }
  .chart-card { display:flex; flex-direction:column; gap:10px; }
  .chart-card h3 { margin:0; font-size:15px; font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chart-card .sub { font-size:12px; color:var(--color-neutral-500); font-family:var(--font-mono); }
  .chart-card .sub strong { color:var(--color-neutral-300); font-weight:500; }
  .chart-card canvas { width:100% !important; height:200px !important; }
  .chart-group { display:flex; flex-direction:column; gap:16px; }
  #trendsContent { display:flex; flex-direction:column; gap:44px; }
  .chart-group-title { margin:0; font-family:var(--font-mono); font-size:13px; font-weight:400; letter-spacing:.16em; text-transform:uppercase; color:var(--color-accent-300); }
  .trend-key { display:flex; align-items:center; gap:18px; color:var(--color-neutral-500); font-family:var(--font-mono); font-size:11px; }
  .trend-key span { display:inline-flex; align-items:center; gap:7px; }
  .trend-line { width:24px; height:0; border-top:2px solid var(--color-accent-400); }
  .trend-line.forecast { border-top-color:var(--color-text); border-top-style:dashed; }
  .forecast-pill { font-family:var(--font-mono); font-size:11px; padding:2px 8px; border-radius:999px; background:color-mix(in srgb, var(--color-accent) 14%, transparent); color:var(--color-accent-300); border:1px solid var(--color-neutral-800); }
  .controls { background:var(--color-card); border:1px solid var(--color-neutral-800); border-radius:var(--radius-md); padding:14px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .controls input[type="search"] { flex:1; min-width:220px; background:#0f101c; border:1px solid var(--color-neutral-800); color:var(--color-text); padding:8px 10px; border-radius:6px; font-family:var(--font-mono); font-size:13px; }
  .controls input::placeholder { color:var(--color-neutral-600); }
  .btn { display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; padding:8px 12px; border-radius:var(--radius-md); border:1px solid var(--color-neutral-800); background:transparent; color:var(--color-neutral-400); cursor:pointer; }
  .btn.active { border-color:var(--color-accent); color:var(--color-accent-300); background:color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .btn.high.active { border-color:var(--high); color:var(--high); background:color-mix(in srgb, var(--high) 12%, transparent); }
  select { background:#0f101c; border:1px solid var(--color-neutral-800); color:var(--color-neutral-300); padding:8px 10px; border-radius:6px; font-family:var(--font-mono); font-size:12px; }
  /* timeline table — dark */
  .timeline-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .timeline-region { min-width:0; }
  .timeline-region-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--color-accent-300); }
  .timeline-region-count { color:var(--color-neutral-600); letter-spacing:.08em; }
  .timeline-wrap { background:var(--color-card); border:1px solid var(--color-neutral-800); border-radius:var(--radius-md); overflow-x:auto; }
  .timeline-wrap table { min-width:760px; }
  .timeline-empty { min-height:94px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--color-neutral-800); border-radius:var(--radius-md); color:var(--color-neutral-600); font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  .previous-day-pill { margin-left:9px; padding:3px 7px; border:1px solid var(--color-neutral-800); border-radius:999px; color:var(--color-neutral-500); font-size:9px; letter-spacing:.1em; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 12px; font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--color-neutral-500); background:#1a1c2b; border-bottom:1px solid var(--color-neutral-800); white-space:nowrap; }
  td { padding:10px 12px; font-size:13px; border-bottom:1px solid #2a2d3a; vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tr.high { background: color-mix(in srgb, var(--high) 9%, transparent); border-left-width:6px !important; }
  tr.medium { background: color-mix(in srgb, var(--medium) 5%, transparent); }
  tr:hover { background: rgba(145,132,217,.06); }
  .cur { font-family:var(--font-mono); font-weight:700; font-size:13px; }
  .flag-img { border:1px solid var(--color-neutral-800); border-radius:2px; vertical-align:middle; object-fit:cover; }
  .time { font-family:var(--font-mono); font-size:12px; color:var(--color-neutral-300); }
  .event-name { font-weight:500; font-size:14px; }
  .muted { color:var(--color-neutral-500); font-family:var(--font-mono); font-size:11px; }
  .importance { display:inline-flex; align-items:center; justify-content:center; min-width:62px; padding:4px 8px; border:1px solid transparent; border-radius:999px; font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:2px; line-height:1; }
  .importance-high { color:#fff; background:var(--high); border-color:#ff8585; box-shadow:0 0 0 3px rgba(232,93,93,.14), 0 0 18px rgba(232,93,93,.2); font-size:14px; }
  .importance-medium { color:#f4bd70; background:rgba(232,165,74,.1); border-color:rgba(232,165,74,.55); }
  .importance-low { color:var(--color-neutral-500); background:rgba(117,121,140,.08); border-color:var(--color-neutral-800); }
  .period-value { display:grid; grid-template-columns:32px auto; align-items:baseline; gap:7px; min-height:22px; white-space:nowrap; }
  .period-label { color:var(--color-neutral-500); font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; }
  footer.site-footer { padding:72px 56px 56px; display:flex; justify-content:space-between; align-items:flex-end; gap:40px; border-top:1px solid var(--color-neutral-800); font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--color-neutral-500); }
  footer .mark-col { display:flex; flex-direction:column; gap:18px; }
  @media (max-width:1100px){ .timeline-grid{grid-template-columns:1fr;} .charts-grid{grid-template-columns:repeat(2, minmax(0, 1fr));} }
  @media (max-width:760px){ .charts-grid{grid-template-columns:1fr;} .site-header{padding:16px 24px;} .site-header nav{gap:18px;} .section{padding:72px 24px;} }
  @media (max-width:640px){ .site-header nav a:first-child{display:none;} .section-head h2{font-size:34px;} table{min-width:760px;} }
</style>
<body>
<header class="site-header">
  <a href="https://podor.org" class="brand">PodorM</a>
  <nav><a href="#calendar">Calendar</a><a href="#trends">Trends</a><a href="#timeline">Timeline</a></nav>
</header>
<div style="height:68px"></div>
<section id="calendar" class="section">
  <div class="section-head">
    <h2>Global Economic Calendar</h2><div class="rule-fade"></div>
    <span id="windowCaption" class="caption">Loading calendar data…</span>
    <div class="snapshot-control">
      <label for="snapshotDate">View snapshot</label>
      <select id="snapshotDate" aria-label="View calendar snapshot by date" disabled></select>
    </div>
    <div id="status" role="status" aria-live="polite">Loading calendar data…</div>
  </div>
</section>
<section id="trends" class="section tinted" hidden>
  <div class="section-head"><h2>Economic trends</h2><div class="rule-fade"></div><span class="caption">Recent releases, grouped by theme</span></div>
  <div class="trend-key"><span><i class="trend-line"></i>Released data</span><span><i class="trend-line forecast"></i>Next forecast</span></div>
  <div id="trendsContent"></div>
</section>
<section id="timeline" class="section">
  <div class="section-head"><h2>Timeline</h2><div class="rule-fade"></div><span class="caption">All times shown in Toronto</span></div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search events" disabled>
    <div style="display:flex; gap:8px;">
      <button class="btn active" data-impact="ALL">All</button>
      <button class="btn high" data-impact="HIGH">High</button>
      <button class="btn medium" data-impact="MEDIUM">Medium</button>
      <button class="btn" data-impact="LOW">Low</button>
    </div>
    <select id="currencyFilter" disabled><option value="ALL">All currencies</option></select>
    <select id="dateFilter" disabled><option value="ALL">All dates</option></select>
  </div>
  <div id="timelineContent"></div>
</section>
<footer class="site-footer"><div class="mark-col"><span>Economic Calendar</span></div><nav><a href="https://podor.org">PodorM</a></nav></footer>
<script>
'use strict';
// The shell has no snapshot values: each view is built exclusively from the selected JSON.
const $ = id => document.getElementById(id);
const flagCodes = {USD:'us', EUR:'eu', GBP:'gb', JPY:'jp', CNY:'cn', AUD:'au', CAD:'ca', CHF:'ch', NZD:'nz', HKD:'hk', SGD:'sg', UAH:'ua', SEK:'se', NOK:'no', MXN:'mx', ZAR:'za', BRL:'br', INR:'in', KRW:'kr', TRY:'tr'};
const categories = [
  ['Labor market', ['jobless','nonfarm','payroll','employment','unemployment','jolts','adp']],
  ['Inflation', ['inflation','consumer price','price index','pce price','personal consumption expenditures','producer price','hicp']],
  ['Growth & demand', ['gross domestic product','gdp','durable goods','personal income','personal spending','retail sales','industrial production','trade balance']],
  ['Housing', ['housing','home sales','house price','mortgage','building permit','construction']],
  ['Business & confidence', ['pmi','ifo','zew','confidence','sentiment','business climate']],
  ['Other', []]
];
const periodLabels = {MoM:'Monthly change', YoY:'Annual change', QoQ:'Quarterly change'};
const allowedCurrencies = new Set(['USD','CAD','EUR','GBP','CHF','EMU','DE','FR','IT','ES','UK']);
const datePattern = /^\d{4}-\d{2}-\d{2}$/;
const localParts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Toronto', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:true});
let manifest, generation = 0, currentDate = null, activeImpact = 'ALL', charts = [];

function element(tag, className='', text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = String(text);
  return node;
}
function setStatus(message, error=false) {
  $('status').textContent = message;
  $('status').setAttribute('role', error ? 'alert' : 'status');
  $('status').style.color = error ? 'var(--high)' : 'var(--color-neutral-500)';
}
function clearView() {
  charts.forEach(chart => chart.destroy());
  charts = [];
  $('trendsContent').replaceChildren();
  $('timelineContent').replaceChildren();
  $('trends').hidden = true;
  $('windowCaption').textContent = 'Loading calendar data…';
  $('search').disabled = $('currencyFilter').disabled = $('dateFilter').disabled = true;
  $('currencyFilter').replaceChildren(new Option('All currencies', 'ALL'));
  $('dateFilter').replaceChildren(new Option('All dates', 'ALL'));
}
async function getJSON(url) {
  const response = await fetch(url, {cache:'no-store'});
  if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
  try { return await response.json(); }
  catch (error) { throw new Error(`${url}: invalid JSON (${error.message})`); }
}
function validateManifest(data) {
  if (!data || !Array.isArray(data.dates) || !datePattern.test(data.latest) ||
      !data.dates.includes(data.latest) || data.dates.some(d => typeof d !== 'string' || !datePattern.test(d))) {
    throw new Error('data/dates.json: invalid snapshot manifest');
  }
  return data;
}
function validateSnapshot(data) {
  if (!data || !Array.isArray(data.events) || data.count !== data.events.length ||
      !data.history || typeof data.history !== 'object' || Array.isArray(data.history) ||
      !data.history_meta || typeof data.history_meta !== 'object' || Array.isArray(data.history_meta)) {
    throw new Error('Snapshot has an invalid events/history schema or count');
  }
  return data;
}
function utcDate(value) {
  if (typeof value !== 'string' || !value) throw new Error('Event has no UTC timestamp');
  // Historical FxStreet snapshots carry a timezone-less datetime_utc; interpret it as UTC.
  const timestamp = new Date(/[zZ]$|[+-]\d\d:\d\d$/.test(value) ? value : `${value}Z`);
  if (Number.isNaN(timestamp.getTime())) throw new Error(`Invalid event timestamp: ${value}`);
  return timestamp;
}
function toronto(value) {
  const parts = Object.fromEntries(localParts.formatToParts(utcDate(value)).map(p => [p.type, p.value]));
  return {
    date: `${parts.year}-${parts.month}-${parts.day}`,
    weekday: parts.weekday,
    time: `${Number(parts.hour)}:${parts.minute} ${parts.dayPeriod}`
  };
}
function splitPeriod(name) {
  const match = /\s*\((MoM|YoY|QoQ)\)\s*$/i.exec(name);
  return match ? [name.slice(0, match.index).trim(), {mom:'MoM',yoy:'YoY',qoq:'QoQ'}[match[1].toLowerCase()]] : [name, null];
}
function displayName(name) {
  return name.replace('Core Personal Consumption Expenditures - Price Index','Core PCE Price Index')
    .replace('Personal Consumption Expenditures - Price Index','PCE Price Index')
    .replace('Personal Consumption Expenditures Prices','PCE Prices');
}
function numeric(value) {
  if (value === null || value === undefined || value === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}
function valueText(value, unit='') {
  const number = numeric(value);
  return number === null ? '—' : `${number}${unit || ''}`;
}
function category(name) {
  const lower = name.toLowerCase();
  // Housing Price Index must stay under Housing rather than Inflation.
  if (lower.includes('housing') || lower.includes('house price')) return 'Housing';
  return categories.find(([, keys]) => keys.some(key => lower.includes(key)))?.[0] || 'Other';
}
function decorateEvents(data) {
  const events = data.events.map(raw => {
    if (typeof raw.event !== 'string') throw new Error('Event has no name');
    const local = toronto(raw.datetime_utc || (raw.date && raw.time && `${raw.date}T${raw.time}`));
    const impact = String(raw.impact || 'NONE').toUpperCase();
    return {...raw, ...local, impact: ['HIGH','MEDIUM','LOW','NONE'].includes(impact) ? impact : 'NONE',
      actual:numeric(raw.actual), forecast:numeric(raw.forecast), previous:numeric(raw.previous)};
  }).sort((a,b) => utcDate(a.datetime_utc).getTime()-utcDate(b.datetime_utc).getTime() || String(a.currency || '').localeCompare(String(b.currency || '')));
  const pairs = new Map();
  for (const e of events) {
    const [base, period] = splitPeriod(e.event);
    if (period !== 'MoM' && period !== 'YoY') continue;
    const key = JSON.stringify([e.date,e.time,e.country,e.currency,base.toLowerCase()]);
    if (!pairs.has(key)) pairs.set(key, {});
    pairs.get(key)[period] = e;
  }
  const seen = new Set(), merged = [];
  for (const e of events) {
    const [base, period] = splitPeriod(e.event);
    const key = JSON.stringify([e.date,e.time,e.country,e.currency,base.toLowerCase()]);
    const pair = pairs.get(key);
    if (pair?.MoM && pair?.YoY) {
      if (seen.has(key)) continue;
      seen.add(key);
      const rows = [pair.MoM,pair.YoY].map((p,i) => ({period:i ? 'YoY' : 'MoM', actual:p.actual, forecast:p.forecast, previous:p.previous, unit:p.unit || ''}));
      const impact = ['HIGH','MEDIUM','LOW','NONE'].find(level => rows.some((_,i) => [pair.MoM,pair.YoY][i].impact === level)) || 'NONE';
      merged.push({...pair.MoM, event:displayName(base), impact, periodRows:rows, searchText:`${base} MoM YoY ${e.currency || ''} ${e.country || ''}`.toLowerCase()});
    } else {
      const name = displayName(e.event);
      merged.push({...e, event:name, periodRows:[], searchText:`${name} ${e.currency || ''} ${e.country || ''}`.toLowerCase()});
    }
  }
  return {events, merged};
}
function flag(currency, width=20) {
  const code = flagCodes[currency];
  if (!code) return element('span','', '🏳️');
  const img = element('img', 'flag-img');
  img.src = `https://flagcdn.com/w20/${code}.png`;
  img.srcset = `https://flagcdn.com/w40/${code}.png 2x`;
  img.width = width; img.height = width === 20 ? 15 : 18;
  img.alt = currency;
  img.onerror = () => { img.replaceWith(document.createTextNode(currency + ' ')); };
  return img;
}
function fillOptions(select, values, label) {
  select.replaceChildren(new Option(label,'ALL'));
  values.forEach(value => select.add(new Option(value,value)));
  select.disabled = false;
}
function renderTimeline(merged, snapshotDate) {
  const byDate = new Map();
  merged.forEach(e => { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); });
  const dates = [...byDate.keys()].sort();
  fillOptions($('currencyFilter'), [...new Set(merged.map(e => e.currency).filter(Boolean))].sort(), 'All currencies');
  fillOptions($('dateFilter'), dates, 'All dates');
  $('search').disabled = false;
  const previousDay = new Date(`${snapshotDate}T12:00:00Z`);
  previousDay.setUTCDate(previousDay.getUTCDate()-1);
  const previous = previousDay.toISOString().slice(0,10);
  for (const day of dates) {
    const group = element('div','day-group'); group.dataset.date = day; group.style.marginBottom = '28px';
    const heading = element('div'); heading.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;border-bottom:1px solid var(--color-neutral-800);padding-bottom:8px';
    const title = element('span','', day+' '); title.style.cssText = 'font-family:var(--font-mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-300)';
    title.append(element('span','muted',byDate.get(day)[0].weekday));
    if (day === previous) title.append(element('span','previous-day-pill','Previous day'));
    heading.append(title); group.append(heading);
    const grid = element('div','timeline-grid');
    for (const region of ['us','other']) {
      const items = byDate.get(day).filter(e => (e.country === 'US') === (region === 'us'));
      const regionEl = element('div','timeline-region'); regionEl.dataset.region = region;
      const regionHead = element('div','timeline-region-head');
      regionHead.append(element('span','',region === 'us' ? 'United States' : 'Other regions'), element('span','timeline-region-count',`${items.length} events`));
      regionEl.append(regionHead);
      if (items.length) {
        const wrap = element('div','timeline-wrap'), table = element('table'), thead = element('thead'), tr = element('tr');
        ['Time (Toronto)','Currency','Importance','Event','Actual','Forecast','Previous'].forEach(label => tr.append(element('th','',label)));
        thead.append(tr); table.append(thead);
        const tbody = element('tbody'); items.forEach(e => tbody.append(renderRow(e)));
        table.append(tbody); wrap.append(table); regionEl.append(wrap);
      } else regionEl.append(element('div','timeline-empty','No scheduled events'));
      grid.append(regionEl);
    }
    group.append(grid); $('timelineContent').append(group);
  }
  if (!dates.length) $('timelineContent').append(element('div','timeline-empty','No scheduled events'));
  applyFilters();
  return dates;
}
function renderRow(e) {
  const tr = element('tr',e.impact.toLowerCase());
  tr.dataset.impact = e.impact; tr.dataset.currency = e.currency || ''; tr.dataset.search = e.searchText;
  tr.style.borderLeft = `4px solid ${{HIGH:'#e85d5d', MEDIUM:'#e8a54a'}[e.impact] || '#75798c'}`;
  tr.append(element('td','time',e.time));
  const cur = element('td'); cur.append(flag(e.currency)); cur.append(element('span','cur',e.currency || '')); tr.append(cur);
  const imp = element('td'), badge = element('span',`importance importance-${e.impact.toLowerCase()}`,e.impact === 'HIGH' ? '★★★' : e.impact === 'MEDIUM' ? '★★' : '★');
  badge.setAttribute('aria-label',`${e.impact[0]}${e.impact.slice(1).toLowerCase()} importance`); imp.append(badge); tr.append(imp);
  tr.append(element('td','event-name',e.event));
  for (const field of ['actual','forecast','previous']) {
    const cell = element('td'); cell.style.fontFamily = 'var(--font-mono)';
    cell.style[field === 'actual' ? 'fontWeight' : 'color'] = field === 'actual' ? '700' : 'var(--color-neutral-400)';
    if (e.periodRows.length) e.periodRows.forEach(row => {
      const div = element('div','period-value');
      div.append(element('span','period-label',row.period), element('span','',valueText(row[field],row.unit)));
      cell.append(div);
    });
    else cell.textContent = valueText(e[field],e.unit);
    tr.append(cell);
  }
  return tr;
}
function historyLabels(series) {
  const values = series.map(p => new Date(`${String(p.periodDateUtc || p.dateUtc || p.date || '').slice(0,10)}T00:00:00Z`));
  const gaps = values.slice(1).map((v,i) => (v-values[i])/86400000).filter(Number.isFinite).sort((a,b)=>a-b);
  const frequent = gaps.length && gaps[Math.floor(gaps.length/2)] <= 14;
  return values.map((v,i) => Number.isNaN(v.getTime()) ? String(series[i].date || '') :
    v.toLocaleDateString('en-US', {timeZone:'UTC', month:'short', ...(frequent ? {day:'2-digit'} : {year:'2-digit'})}).replace(/ (\d\d)$/, frequent ? ' $1' : " '$1"));
}
function renderTrends(data, events) {
  const all = [];
  for (const [id, series] of Object.entries(data.history)) {
    if (!Array.isArray(series) || !series.some(p => numeric(p.actual) !== null)) continue;
    const meta = data.history_meta[id] || {}, currency = meta.currency || '';
    if (!allowedCurrencies.has(currency)) continue;
    const [name,period] = splitPeriod(meta.event || 'Unknown');
    const upcoming = events.find(e => e.eventId === id);
    const actuals = series.map(p => numeric(p.actual));
    const latest = [...actuals].reverse().find(n => n !== null);
    const label = upcoming ? new Date(`${upcoming.date}T12:00:00Z`).toLocaleDateString('en-US',{timeZone:'UTC', month:'short',day:'2-digit'})+` at ${upcoming.time}` : null;
    all.push({event:displayName(name), currency, unit:meta.unit || '', period, category:category(meta.event || ''),
      labels:historyLabels(series), actuals, latest, forecast:upcoming ? upcoming.forecast : null, upcomingLabel:label});
  }
  all.sort((a,b) => categories.findIndex(c => c[0] === a.category)-categories.findIndex(c => c[0] === b.category) ||
    a.event.toLowerCase().localeCompare(b.event.toLowerCase()) || ['MoM','YoY','QoQ',null].indexOf(a.period)-['MoM','YoY','QoQ',null].indexOf(b.period));
  $('trends').hidden = !all.length;
  for (const [name] of categories) {
    const groupCharts = all.filter(ch => ch.category === name);
    if (!groupCharts.length) continue;
    const group = element('div','chart-group'), title = element('h3','chart-group-title',name), grid = element('div','charts-grid');
    group.append(title);
    for (const ch of groupCharts) {
      const card = element('div','card elev-sm chart-card'), h3 = element('h3');
      h3.append(flag(ch.currency,24), document.createTextNode(' '+ch.event)); card.append(h3);
      const sub = element('div','sub');
      if (ch.currency) sub.append(element('strong','',ch.currency), document.createTextNode(' · '));
      if (periodLabels[ch.period]) sub.append(document.createTextNode(periodLabels[ch.period]+' · '));
      sub.append(document.createTextNode('Latest '), element('strong','',valueText(ch.latest,ch.unit)));
      if (ch.forecast !== null) sub.append(document.createTextNode(' · Next forecast '), element('span','forecast-pill',valueText(ch.forecast,ch.unit)));
      if (ch.upcomingLabel) sub.append(document.createTextNode(' · '+ch.upcomingLabel));
      card.append(sub);
      const canvas = element('canvas'); canvas.width = 420; canvas.height = 200; card.append(canvas); grid.append(card);
      if (typeof Chart !== 'undefined') charts.push(drawChart(canvas,ch));
    }
    group.append(grid); $('trendsContent').append(group);
  }
  if (all.length && typeof Chart === 'undefined') $('trendsContent').prepend(element('div','timeline-empty','Charts unavailable: Chart.js could not load.'));
}
function drawChart(canvas, ch) {
  const labels = [...ch.labels];
  const datasets = [{label:'Actual',data:ch.actuals,borderColor:'#b5abfc',backgroundColor:'transparent',fill:false,tension:0.3,pointRadius:2,borderWidth:1.8}];
  if (ch.forecast !== null) {
    datasets.push({label:'Forecast', data:Array(Math.max(0,labels.length-1)).fill(null).concat([ch.latest,ch.forecast]),
      borderColor:'#e9e9ed',backgroundColor:'#e9e9ed',borderDash:[5,5],pointRadius:4,pointStyle:'star',tension:0.25});
    labels.push('Forecast');
  }
  return new Chart(canvas.getContext('2d'), {type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
    layout:{padding:{left:8,right:12,top:6,bottom:6}},
    interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1c2b',titleColor:'#e9e9ed',bodyColor:'#e9e9ed',borderColor:'#3f424d',borderWidth:1,callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+ch.unit}}},
    scales:{x:{ticks:{font:{size:10,family:'JetBrains Mono'},color:'#9397ab',maxRotation:0,autoSkip:true,maxTicksLimit:8},grid:{color:'#232532'}},y:{ticks:{font:{size:10,family:'JetBrains Mono'},color:'#9397ab',padding:6},grid:{color:'#232532'}}}}});
}
function applyFilters() {
  const q = $('search').value.trim().toLowerCase(), cur = $('currencyFilter').value, day = $('dateFilter').value;
  document.querySelectorAll('#timeline tbody tr').forEach(tr => {
    tr.style.display = (activeImpact === 'ALL' || tr.dataset.impact === activeImpact) &&
      (cur === 'ALL' || tr.dataset.currency === cur) &&
      (day === 'ALL' || tr.closest('.day-group').dataset.date === day) &&
      (!q || tr.dataset.search.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.day-group').forEach(group => {
    group.style.display = [...group.querySelectorAll('tbody tr')].some(tr => tr.style.display !== 'none') ? '' : 'none';
  });
}
async function selectSnapshot(date) {
  const request = ++generation;
  clearView(); setStatus(`Loading snapshot ${date}…`);
  try {
    if (!manifest.dates.includes(date)) throw new Error(`Snapshot ${date} is not listed in data/dates.json`);
    const data = validateSnapshot(await getJSON(date === manifest.latest ? 'data/latest.json' : `data/archive/${date}.json`));
    if (request !== generation) return;
    const {events,merged} = decorateEvents(data);
    renderTrends(data,events);
    const dates = renderTimeline(merged,date);
    $('windowCaption').textContent = `${date} to ${dates.at(-1) || data.end || date}`;
    document.title = `Global Economic Calendar — ${date} to ${dates.at(-1) || data.end || date} | PodorM`;
    currentDate = date; setStatus('');
  } catch(error) {
    if (request !== generation) return;
    clearView(); currentDate = null;
    setStatus(`Calendar data unavailable: ${error.message}`,true);
    console.error('Calendar data unavailable',error);
  }
}
async function initialize() {
  const requested = new URLSearchParams(window.location.search).get('date');
  try {
    manifest = validateManifest(await getJSON('data/dates.json'));
    $('snapshotDate').replaceChildren();
    manifest.dates.forEach(date => $('snapshotDate').add(new Option(date === manifest.latest ? `${date} · Latest` : date,date)));
    $('snapshotDate').disabled = false;
    const selected = requested || manifest.latest;
    if (manifest.dates.includes(selected)) $('snapshotDate').value = selected;
    await selectSnapshot(selected);
  } catch(error) {
    clearView(); setStatus(`Calendar data unavailable: ${error.message}`,true);
    console.error('Calendar manifest unavailable',error);
  }
}
$('snapshotDate').addEventListener('change', () => {
  const date = $('snapshotDate').value;
  const url = new URL(window.location.href);
  if (date === manifest.latest) url.searchParams.delete('date'); else url.searchParams.set('date',date);
  history.pushState(null,'',url);
  selectSnapshot(date);
});
window.addEventListener('popstate', () => {
  const date = new URLSearchParams(location.search).get('date') || manifest.latest;
  if (manifest.dates.includes(date)) $('snapshotDate').value = date;
  selectSnapshot(date);
});
$('search').addEventListener('input',applyFilters);
$('currencyFilter').addEventListener('change',applyFilters);
$('dateFilter').addEventListener('change',applyFilters);
document.querySelectorAll('[data-impact]').forEach(button => button.addEventListener('click', () => {
  document.querySelectorAll('[data-impact]').forEach(other => other.classList.remove('active'));
  button.classList.add('active'); activeImpact = button.dataset.impact; applyFilters();
}));
initialize();
</script>
