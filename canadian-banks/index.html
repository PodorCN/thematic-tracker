<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THEME TRACKER // 加拿大银行业</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{
  --bg:#060807; --panel:#0b100c; --panel2:#0e1510; --line:#1a2b1f; --line2:#24402d;
  --txt:#c9d6cc; --mut:#5f7063; --dim:#8fa596;
  --acc:#00f48e; --acc-dim:rgba(0,244,142,.12);
  --loss:#ff5f5f; --loss-dim:rgba(255,95,95,.10);
  --amber:#ffb454; --teal:#4ec9b0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt);
  font-family:'JetBrains Mono','PingFang SC','Microsoft YaHei',monospace;
  font-size:14px; line-height:1.65; overflow-x:hidden;
}
body::after{
  content:""; position:fixed; inset:0; z-index:9999; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  opacity:.5;
}
::selection{background:var(--acc);color:#000}
a{color:var(--acc);text-decoration:none}
.glow{text-shadow:0 0 6px rgba(0,244,142,.55),0 0 18px rgba(0,244,142,.18)}
.glow-r{text-shadow:0 0 6px rgba(255,95,95,.5)}
.mono-num{font-variant-numeric:tabular-nums}

/* ── top bar ─────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center;
  padding:14px 28px; background:rgba(6,8,7,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.topbar .cmd{color:var(--acc); font-weight:600; letter-spacing:.04em}
.cursor{display:inline-block;width:9px;height:16px;background:var(--acc);vertical-align:-2px;animation:blink 1.05s steps(1) infinite;margin-left:6px}
@keyframes blink{50%{opacity:0}}
.topbar .meta{color:var(--mut); font-size:12px}
.topbar .meta b{color:var(--dim);font-weight:600}

/* ── layout ──────────────────────────── */
.wrap{width:100%; padding:0 28px 80px}
section{margin-top:56px}
.sec-head{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.sec-head h2{font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--txt)}
.sec-head h2::before{content:"> ";color:var(--acc)}
.sec-head span{color:var(--mut);font-size:12px}

/* ── hero title ──────────────────────── */
.hero{padding-top:48px}
.hero .kicker{color:var(--acc);font-size:12px;letter-spacing:.3em;margin-bottom:10px}
.hero h1{font-size:clamp(30px,4.6vw,58px);font-weight:800;line-height:1.12;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero .sub{color:var(--dim);max-width:860px;margin-top:14px;font-size:14px}

/* ── proxy chips ─────────────────────── */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:28px}
.chip{
  border:1px solid var(--line); background:var(--panel); padding:14px 16px; position:relative;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
}
.chip .role{font-size:10px;letter-spacing:.22em;color:var(--mut)}
.chip .tk{font-size:17px;font-weight:800;margin:2px 0 1px}
.chip .nm{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ret{font-size:20px;font-weight:800;margin-top:8px}
.chip.main{border-color:var(--line2)}
.chip.main::before{content:"MAIN PROXY";position:absolute;top:6px;right:14px;font-size:9px;letter-spacing:.2em;color:var(--acc)}
.up{color:var(--acc)} .dn{color:var(--loss)}
@media(max-width:900px){.chips{grid-template-columns:repeat(2,1fr)}}

/* ── chart panel ─────────────────────── */
.panel{
  border:1px solid var(--line); background:var(--panel); position:relative;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  padding:18px 18px 8px;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.panel-head .t{font-weight:600}
.panel-head .t::before{content:"> ";color:var(--acc)}
.modebtn{
  font-family:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer;
  background:transparent;color:var(--mut);border:1px solid var(--line);padding:6px 14px;margin-left:8px;
}
.modebtn.on{color:#000;background:var(--acc);border-color:var(--acc)}
#chart{width:100%;height:560px}

/* ── stats strip ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);background:var(--panel)}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:10px;letter-spacing:.18em;color:var(--mut)}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat .s{font-size:11px;color:var(--mut);margin-top:2px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}}

/* ── verdict ─────────────────────────── */
.verdict{border-left:2px solid var(--acc);background:var(--panel2);padding:20px 24px;margin-top:20px}
.verdict p{color:var(--dim);max-width:1000px}
.verdict b{color:var(--txt)}

/* ── timeline ────────────────────────── */
.tl{position:relative;margin-left:8px;padding-left:44px}
.tl::before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.ev{position:relative;margin-bottom:30px;cursor:pointer;display:flex;gap:26px;align-items:flex-start}
.ev .node{
  position:absolute;left:-37px;top:14px;width:13px;height:13px;border:1px solid var(--acc);
  background:var(--bg);transform:rotate(45deg);flex:none;
}
.ev.neg .node{border-color:var(--loss)}
.ev-left{flex:0 0 148px;padding-top:4px;text-align:left}
.ev-date{font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.15;color:var(--txt)}
.ev-date .yr{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.24em;margin-top:3px}
.ev-ret{display:inline-block;margin-top:12px;font-size:17px;font-weight:800;padding:3px 10px;border:1px solid}
.ev-ret.up{color:var(--acc);border-color:rgba(0,244,142,.35);background:var(--acc-dim)}
.ev-ret.dn{color:var(--loss);border-color:rgba(255,95,95,.35);background:var(--loss-dim)}
.ev-ret-lb{display:block;font-size:9px;letter-spacing:.2em;color:var(--mut);margin-top:6px}
.ev .card{flex:1}
@media(max-width:760px){.ev{flex-direction:column;gap:10px}.ev-left{padding-top:0}}
.ev .card{
  border:1px solid var(--line);background:var(--panel);padding:18px 22px;transition:border-color .25s,background .25s;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
.ev:hover .card{border-color:var(--acc);background:var(--panel2)}
.ev .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px}
.ev .num{color:var(--mut);letter-spacing:.1em}
.tag{padding:2px 10px;border:1px solid;font-size:10px;letter-spacing:.18em}
.t-earn{color:var(--acc);border-color:rgba(0,244,142,.4);background:var(--acc-dim)}
.t-mon{color:var(--amber);border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
.t-geo{color:var(--loss);border-color:rgba(255,95,95,.4);background:var(--loss-dim)}
.t-mac{color:var(--teal);border-color:rgba(78,201,176,.4);background:rgba(78,201,176,.08)}
.t-val{color:#e08fff;border-color:rgba(224,143,255,.35);background:rgba(224,143,255,.07)}
.ev h3{font-size:16px;font-weight:800;margin:10px 0 8px;line-height:1.5}
.ev .why{color:var(--dim);font-size:13px;max-width:980px}
.ev .why b{color:var(--txt)}
.moves{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mv{border:1px solid var(--line);padding:6px 12px;font-size:12px;background:rgba(0,0,0,.25)}
.mv .lb{color:var(--mut);margin-right:8px;font-size:10px;letter-spacing:.14em}
.mv .vl{font-weight:800}
.src{font-size:10.5px;color:var(--mut);margin-top:10px}

/* ── catalysts ───────────────────────── */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cat{
  border:1px solid rgba(255,180,84,.35);background:rgba(255,180,84,.05);padding:20px 22px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
.cat.hot{border-color:var(--amber);background:rgba(255,180,84,.1)}
.cat .d{color:var(--amber);font-size:11px;letter-spacing:.16em;font-weight:600}
.cat h3{font-size:15px;font-weight:800;margin:8px 0 8px}
.cat p{color:var(--dim);font-size:12.5px}
.cat p b{color:var(--txt)}

/* ── footer ──────────────────────────── */
footer{margin-top:70px;border-top:1px solid var(--line);padding:22px 0 10px;color:var(--mut);font-size:11px;line-height:1.9}
footer b{color:var(--dim)}

/* reveal */
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
</style>
<style>
#loading{padding:120px 28px;color:var(--acc);font-size:14px;letter-spacing:.08em}
.tone-warn{color:var(--amber)} .tone-up{color:var(--acc)} .tone-dn{color:var(--loss)} .tone-flat{color:var(--txt)}
.stat .v.up{color:var(--acc)} .stat .v.dn{color:var(--loss)} .stat .v.warn{color:var(--amber)} .stat .v.flat{color:var(--txt)}
</style>
</head>
<body>

<header class="topbar">
  <div class="cmd">> THEME_TRACKER <span style="color:var(--mut)">--source</span> theme.md <span class="cursor"></span></div>
  <div class="meta" id="metaBar">LOADING…</div>
</header>

<div class="wrap" id="app"><div id="loading">> parsing theme.md <span class="cursor"></span></div></div>

<script>
/* ══════════════ mini-markdown → html ══════════════ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mdInline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}

/* ══════════════ theme.md parser ══════════════ */
function parseTheme(md){
  const out = {meta:{}, sections:{}};
  const fm = md.match(/^---\n([\s\S]*?)\n---/);
  if(fm) fm[1].split("\n").forEach(l=>{ const m=l.match(/^([\w_]+):\s*(.*)$/); if(m) out.meta[m[1]]=m[2].trim(); });
  const body = md.slice(fm? fm[0].length : 0);
  const parts = body.split(/^## /m).filter(s=>s.trim());
  parts.forEach(p=>{
    const nl = p.indexOf("\n");
    out.sections[p.slice(0,nl).trim()] = p.slice(nl+1);
  });
  return out;
}
function parseTable(sec){
  return sec.split("\n").filter(l=>/^\|/.test(l) && !/^\|[\s\-\|]+\|$/.test(l))
    .slice(1).map(l=> l.split("|").slice(1,-1).map(c=>c.trim()));
}
function parseEvents(sec){
  return sec.split(/^### /m).filter(s=>s.trim()).map(b=>{
    const lines = b.split("\n").map(l=>l.trim()).filter(Boolean);
    const head = lines[0].split("|").map(s=>s.trim());
    const retM = head[2] ? head[2].match(/([+\-]?[\d.]+%)/) : null;
    const ev = {num:head[0].replace("#",""), date:head[1], ret: retM? retM[1] : "—",
                retNeg: retM ? retM[1].startsWith("-") : false, tag: head[3]||"", paras:[], moves:[], src:""};
    let i=1;
    if(lines[i] && /^\*\*.*\*\*$/.test(lines[i])){ ev.title = lines[i].replace(/\*\*/g,""); i++; }
    for(; i<lines.length; i++){
      const l = lines[i];
      if(l.startsWith("MOVES:")) ev.moves = l.slice(6).split("|").map(s=>s.trim()).map(p=>{
        const kv=p.split("="); return {lb:kv[0].trim(), vl:(kv[1]||"").trim()};});
      else if(l.startsWith("SRC:")) ev.src = l.slice(4).trim();
      else ev.paras.push(l);
    }
    return ev;
  });
}
function parseCats(sec){
  return sec.split(/^### /m).filter(s=>s.trim()).map(b=>{
    const lines = b.split("\n").map(l=>l.trim()).filter(Boolean);
    const head = lines[0].split("|").map(s=>s.trim());
    return {date:head[0], flag:head[1]||"", title:head[2]||"", para:lines.slice(1).join(" ")};
  });
}
function parseChart(sec){
  const m = sec.match(/```json\n([\s\S]*?)\n```/);
  return m ? JSON.parse(m[1]) : null;
}

/* ══════════════ tag → class ══════════════ */
const TAGCLS = {"Earnings":"t-earn","Monetary Policy":"t-mon","Geopolitics":"t-geo","Macro Data":"t-mac","Valuation & Sentiment":"t-val","Trade War":"t-geo","Momentum":"t-earn","Valuation":"t-val"};
function tagCls(t){ for(const k in TAGCLS) if(t.includes(k)) return TAGCLS[k]; return "t-mac"; }

/* ══════════════ render ══════════════ */
const WK=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function render(md){
  const T = parseTheme(md);
  const meta = T.meta;
  document.getElementById("metaBar").innerHTML =
    `LAST UPDATE <b>${meta.updated||"—"}</b> · WINDOW <b>${meta.window||"3M"}</b> · CCY <b>${meta.currency||"CAD"}</b> · SRC <b>theme.md</b>`;

  const proxies = parseTable(T.sections["PROXIES"]||"");
  const stats   = parseTable(T.sections["STATS"]||"");
  const events  = parseEvents(T.sections["EVENTS"]||"");
  const cats    = parseCats(T.sections["CATALYSTS"]||"");
  const CD      = parseChart(T.sections["CHARTDATA"]||"");

  let chips = proxies.map(p=>{
    const [role,tk,nm,ret,extra]=p;
    const cls = ret.includes("-")?"dn":"up";
    const main = role.includes("MAIN")?" main":"";
    const badge = main?'<div class="role"></div>':"";
    return `<div class="chip${main}">
      <div class="role">${esc(role)}</div>
      <div class="tk">${esc(tk)}</div><div class="nm">${esc(nm)}</div>
      <div class="ret ${cls} mono-num">${esc(ret)}</div><div class="nm">${esc(extra||"")}</div></div>`;
  }).join("");

  let statsHtml = stats.map(s=>{
    const [k,v,sub,tone]=s;
    return `<div class="stat"><div class="k">${esc(k)}</div><div class="v ${tone||"flat"} mono-num">${esc(v)}</div><div class="s">${esc(sub||"")}</div></div>`;
  }).join("");

  let evHtml = [...events].reverse().map(e=>{
    const d = new Date(e.date+"T00:00:00");
    const mon = isNaN(d)? e.date : MON[d.getMonth()];
    const day = isNaN(d)? "" : String(d.getDate()).padStart(2,"0");
    const yr  = isNaN(d)? "" : `${d.getFullYear()} · ${WK[d.getDay()]}`;
    const rc  = e.retNeg ? "dn" : "up";
    const neg = e.retNeg ? " neg" : "";
    const mv = e.moves.map(mv2=>{
      const c = mv2.vl.startsWith("-")?"dn":(mv2.vl.startsWith("+")||/BEAT/i.test(mv2.vl)?"up":"");
      return `<span class="mv"><span class="lb">${esc(mv2.lb)}</span><span class="vl ${c} mono-num">${esc(mv2.vl)}</span></span>`;
    }).join("");
    return `<div class="ev${neg} rv" data-ev="${parseInt(e.num)}">
      <div class="node"></div>
      <div class="ev-left">
        <div class="ev-date">${mon} ${day}<span class="yr">${yr}</span></div>
        <div><span class="ev-ret ${rc} mono-num">${esc(e.ret)}</span></div>
        <div class="ev-ret-lb">ZEB DAILY</div>
      </div>
      <div class="card">
        <div class="row1"><span class="num">#${e.num}</span><span class="tag ${tagCls(e.tag)}">${esc(e.tag)}</span></div>
        <h3>${mdInline(e.title)}</h3>
        ${e.paras.map(p=>`<p class="why">${mdInline(p)}</p>`).join("")}
        <div class="moves">${mv}</div>
        <div class="src">SOURCE: ${esc(e.src)}</div>
      </div></div>`;
  }).join("");

  let catHtml = cats.map(c=>{
    const hot = c.flag.toLowerCase().includes("hot")?" hot":"";
    return `<div class="cat${hot} rv"><div class="d">${esc(c.date)} · ${esc(c.flag)}</div>
      <h3>${mdInline(c.title)}</h3><p>${mdInline(c.para)}</p></div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
  <section class="hero">
    <div class="kicker rv">THEMATIC TRACKER</div>
    <h1 class="rv">${esc(meta.theme_cn||"")} <em>// ${esc(meta.theme_en||"")}</em></h1>
    <div class="chips rv">${chips}</div>
  </section>
  <section>
    <div class="sec-head"><h2>ZEB.TO + EVENT MARKERS</h2><span>numbered markers = timeline events · click a card to locate on chart</span></div>
    <div class="panel">
      <div class="panel-head"><div class="t">ZEB.TO vs S&amp;P 500 vs SUPPORTIVE PROXIES — BASE=100</div></div>
      <div id="chart"></div>
    </div>
    <div class="stats" style="margin-top:16px">${statsHtml}</div>
    <div class="verdict rv"><p><b>VERDICT:</b> ${mdInline((T.sections["VERDICT"]||"").trim())}</p></div>
  </section>
  <section>
    <div class="sec-head"><h2>DRIVER TIMELINE</h2><span>newest first · ZEB daily move on the left of each card</span></div>
    <div class="tl">${evHtml}</div>
  </section>
  <section>
    <div class="sec-head"><h2>NEXT CATALYSTS</h2><span>ordered by significance</span></div>
    <div class="cats">${catHtml}</div>
  </section>
  <footer>
    <b>DATA</b> Prices: Yahoo Finance · All content & attribution rendered from <b>theme.md</b> (updated daily by the agent per agent.md)<br>
    <b>PROTOCOL</b> |ZEB daily move| &gt; 1.5% requires attribution · ZEB/TSX divergence &gt; 1pp = bank-specific event · BANK.TO leverage confirms trend · HFIN.TO divergence splits bank-specific vs broad-financial drivers<br>
    <b>DISCLAIMER</b> Research tracker only. Not investment advice.
  </footer>`;

  if(CD) drawChart(CD, events);
  bindCards();
  observeReveal();
}

/* ══════════════ chart ══════════════ */
const ACC="#00f48e", LOSS="#ff5f5f", MUT="#5f7063", GRID="#16211a", TXT="#c9d6cc";
const FONT={family:"'JetBrains Mono','PingFang SC',monospace", color:TXT, size:11};
let EVH=[], EVT=[], EVTRACE=6;

function drawChart(D, events){
  const idx = Object.fromEntries(D.dates.map((d,i)=>[d,i]));
  const evX=[], evY=[], evT=[], evC=[]; EVH=[];
  events.forEach(e=>{ const i=idx[e.date]; if(i==null) return;
    evX.push(e.date); evY.push(D.zeb_norm[i]); evT.push(String(parseInt(e.num)));
    evC.push(e.retNeg?LOSS:ACC); EVH.push(e.title); });

  const vlines = evX.map(x=>({type:"line", x0:x, x1:x, y0:0, y1:1, yref:"paper",
    line:{color:"rgba(0,244,142,.10)", width:1, dash:"dot"}}));
  const volColors = D.zeb_ret.map(r=> r==null? MUT : (r>=0? "rgba(0,244,142,.22)":"rgba(255,95,95,.22)"));

  const traces = [
    {x:D.dates, y:D.volume, type:"bar", yaxis:"y2", marker:{color:volColors}, hoverinfo:"skip", showlegend:false},
    {x:D.dates, y:D.tsx_norm, name:"S&P/TSX", type:"scatter", mode:"lines",
     line:{color:"rgba(95,112,99,.65)", width:1.2, dash:"dot"},
     hovertemplate:"%{x}<br>S&P/TSX <b>%{y:.1f}</b><extra></extra>"},
    {x:D.dates, y:D.bank_norm, name:"BANK.TO (1.25x)", type:"scatter", mode:"lines",
     line:{color:"rgba(255,180,84,.4)", width:1.2},
     hovertemplate:"%{x}<br>BANK.TO <b>%{y:.1f}</b><extra></extra>"},
    {x:D.dates, y:D.hfin_norm, name:"HFIN.TO", type:"scatter", mode:"lines",
     line:{color:"rgba(78,201,176,.4)", width:1.2},
     hovertemplate:"%{x}<br>HFIN.TO <b>%{y:.1f}</b><extra></extra>"},
    {x:D.spx_dates, y:D.spx_norm, name:"S&P 500", type:"scatter", mode:"lines",
     line:{color:"#e8ecdf", width:2.2},
     hovertemplate:"%{x}<br>S&P 500 <b>%{y:.1f}</b><extra></extra>"},
    {x:D.dates, y:D.zeb_norm, name:"ZEB.TO (MAIN)", type:"scatter", mode:"lines",
     line:{color:ACC, width:3.2},
     hovertemplate:"%{x}<br>ZEB.TO <b>%{y:.1f}</b><extra></extra>"},
    {x:evX, y:evY, type:"scatter", mode:"markers+text", name:"EVENT",
     marker:{size:18, color:evC, line:{color:"#060807",width:1.5}, symbol:"diamond"},
     text:evT, textfont:{size:9.5, color:"#060807", family:"JetBrains Mono"},
     hovertemplate:"<b>#%{text}</b> %{customdata}<br>%{x} · ZEB %{y:.1f}<extra></extra>",
     customdata:EVH, showlegend:false}
  ];
  EVT = evT;

  const layout = {

function bindCards(){
  document.querySelectorAll(".ev").forEach(el=>{
    el.addEventListener("click", ()=>{
      const n = parseInt(el.dataset.ev);
      document.getElementById("chart").scrollIntoView({behavior:"smooth", block:"center"});
      const i = EVT.findIndex(t=>parseInt(t)===n);
      if(i<0) return;
      let on=true, cnt=0;
      const t = setInterval(()=>{
        const s = EVT.map((_,k)=> (k===i && on)?32:18);
        Plotly.restyle("chart", {"marker.size":[s]}, [EVTRACE]);
        on=!on; if(++cnt>7) clearInterval(t);
      }, 260);
    });
  });
}

function observeReveal(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("in"); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}

The group trades at ~15.3x forward (historical average ~10x); Morningstar estimates it ~**22%** above fair value. A reversion to the historical range implies 21–33% downside on individual banks. **Nothing needs to get worse — it only needs to stop getting better.** Re-check this risk daily while holding the theme.
