explainer: 'Snapshot uses October 27 US closes for GLD (20:00 UTC) and the Comex settlement for December gold futures (13:30 ET, 17:30 UTC); the two are not simultaneous. Price Return uses Yahoo quote.close, split adjusted and excluding distributions; GLD carries a 0.40% expense ratio, so it lags spot gold by that drag plus tracking error. 1W anchors October 20, 1M September 25, YTD December 31, 2025. Real yield means the nominal Treasury yield minus expected inflation; a higher real yield raises the opportunity cost of a metal that pays no coupon. Volume confirmation needs at least 1.25 times the prior 20 sessions excluding the latest day; GLD was 0.67x, so it fails. The January peak and the September 28 settlement are secondary reports of Comex and spot data, labelled as such; the daily closes in the table come from Yahoo. Front-month futures series: https://query1.finance.yahoo.com/v8/finance/chart/GC=F .'
