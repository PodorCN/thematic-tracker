summary: 'Gold''s safe-haven premium is unwinding. GLD returned -5.37% over one month against -0.27% for the S&P 500, and -6.06% this year. Gold futures settled at $4,060, about 27% below January''s $5,595 peak; silver fell 15.8% and miners 10.4% over the month. The driver is opportunity cost: the Fed hiked in September, December hike odds are about 83%, and real yields remain high even after the 10-year yield slipped below 5%. A one-day bounce is the counterevidence.'
body_text: 'GLD closed at $372.28 on October 27. It lost 5.37% over one month while the S&P 500 lost 0.27%, and it is down 6.06% this year. December gold futures settled at $4,060, 27% below January''s $5,595 peak. Silver fell 15.80% over the month and the miners ETF GDX fell 10.42%, so the move is across the complex rather than one contract.


  The first leg was September 28: gold futures settled 3.52% lower as the 10-year yield traded above 5.2% and October hike odds rose to about 70%, less than two weeks after the Fed''s September 16 hike to 3.75-4.00%. The second leg was October 22, when GLD fell 2.63% and silver 4.63% while crude stayed near $100 and kept the inflation and hike path alive.


  The competing explanation is that this is only a correction: the metal had fallen quickly, and it rose 1.21% on October 27 as oil softened before the Fed.


  So what: the marginal buyer now earns a positive real yield in Treasuries. Watch the October 28 FOMC, October 29 PCE and December 9 decision; a dovish surprise or a Hormuz deal that lowers oil would help gold, while a December hike would not.'
