title: 'Long Yields: The Inflation Trade Stalls'
status: Fading
status_note: 'Still Fading: the 10-year fell to 4.99% and TLT gained 2.9% in a month despite hot inflation.'
conviction: Low
horizon: Tactical 2-8w
created_at: '2026-09-30'
