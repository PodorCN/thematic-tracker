- when: Oct 22
  label: Haven buying drove the biggest yield drop since 2023
  detail: The 10-year fell about 19 basis points to 4.953% on the ^TNX series as AI shares sold off.
- when: Oct 27
  label: The 10-year is back below 5 percent
  detail: TLT closed at $81.63; the higher-yield thesis still lacks price confirmation.
explainer: 'Snapshot uses October 27 US closes (20:00 UTC). Price Return uses Yahoo quote.close, split adjusted and excluding distributions; TLT has a 0.15% expense ratio and roughly 17 years of duration, so a 1% yield move changes its price by about 17%. 1W anchors October 20, 1M September 25, YTD December 31, 2025, with the proxy and benchmark on the same sessions. The 10-year figure is the Yahoo ^TNX yield index, not a bond return; a lower TLT price means a higher yield, and the table is not sign-inverted. Volume confirmation needs at least 1.25 times the prior 20 sessions excluding the latest day; TLT was 0.42x, so it fails. No decomposition into term premium versus policy expectations is claimed. Fed calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm . CNBC reported a 17bp drop to 4.972% on its index for October 22; the ^TNX series closed at 4.953%, a 19.3bp drop. September CPI (3.7%): https://www.bls.gov/news.release/archives/cpi_10142026.htm (the BLS page blocks
  scripted access; the figure matches the October 14 release carried in the prior archive). December odds (83%): https://www.cnbc.com/2026/10/27/gold-eases-on-firmer-dollar-ahead-of-fed-decision.html .'
