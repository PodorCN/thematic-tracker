  detail: QQQ rose 1.27% and AMD 5.45% in the latest session; credit spreads are still the test.
explainer: 'Snapshot uses October 27 US closes (20:00 UTC). Price Return uses Yahoo quote.close, split adjusted and excluding distributions. 1W anchors October 20, 1M September 25, YTD December 31, 2025, with the proxy and benchmark on the same common sessions. QQQ is a concentrated growth fund, not an AI revenue index, and SMH is the semiconductor subset. Volume confirmation needs the latest volume at least 1.25 times the prior 20 sessions excluding the latest day; QQQ was 0.85x, so it fails. A credit default swap spread is the annual cost of insuring against default; 1,000 basis points means 10% of notional a year. Negative free cash flow means operating cash flow did not cover capital spending. The debt-to-capex link is a financing interpretation supported by the cited issuer and credit-market reports, not a measured causal model. Nvidia demand comment: https://www.cnbc.com/2026/10/22/treasurys-bonds-ai-yields.html .'
