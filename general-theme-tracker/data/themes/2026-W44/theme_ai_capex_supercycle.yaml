updated_at: '2026-10-27'
data_quality: production
summary: AI spending is no longer a pure demand story. QQQ returned -3.12% over one month against -0.27% for the S&P 500, and Meta is down 17.5% over the month, including a 6.98% drop after it reported negative free cash flow, $135-145 billion of 2026 capex and a new non-voting share class to raise money. CoreWeave's credit default swaps trade above 1,000 basis points and its 2031 bond yields about 15.6%. Nvidia says demand is off the charts but capital is scarce. Fading means financing, not demand, is now the constraint; a one-week rebound does not reverse that.
body_text: 'QQQ closed at $721.25 on October 27. It lost 3.12% over one month while the S&P 500 lost 0.27%, and the semiconductor ETF SMH fell 8.01%. The weakness is concentrated in the companies paying for the build-out: Meta fell 17.49% over the month, Alphabet 6.79%, AMD 11.16%, Micron 14.18% and Vertiv 17.66%.


  The trigger was Meta''s October 21 third-quarter report. Capital spending for 2026 is now $135-145 billion, free cash flow was negative $2.12 billion, and the company created a Class C non-voting stock explicitly to finance AI growth. Meta fell 6.98% the next session and its five-year credit default swap spread reached a record. CoreWeave''s swaps had already passed 1,000 basis points on October 15, with its 9.75% 2031 bond yielding about 15.6%.


  The competing explanation is that this is only a valuation reset. Demand evidence is still strong: Nvidia''s chief executive said neocloud demand is off the charts, and QQQ rose 0.50% in the last week while AMD gained 4.77%.


  So what: the marginal change is from who can buy chips to who can finance them. Watch the October 28 FOMC, October 29 PCE, credit spreads and Nvidia''s November 17 results.'
