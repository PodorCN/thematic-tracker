title: 'AI Capex: Growth Now Funded With Debt'
status: Fading
status_note: 'Still Fading: QQQ fell 3.1% in a month as Meta''s negative free cash flow and AI credit stress hit the trade.'
conviction: Med
horizon: Cyclical 3-12m
