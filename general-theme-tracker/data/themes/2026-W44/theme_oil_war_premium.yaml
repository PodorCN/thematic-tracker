explainer: 'Snapshot uses October 27 completed sessions: US and Canadian equities at 16:00 ET (20:00 UTC); WTI is the Yahoo front-month daily settlement, not a simultaneous equity quote. Price Return uses Yahoo quote.close, split adjusted and excluding cash distributions. 1W anchors October 20, 1M September 25, YTD December 31, 2025; both legs use the same common sessions. XLE holds integrated majors, refiners and service companies, so it is not a crude contract and can lag or lead spot prices. Volume confirmation requires the latest volume to be at least 1.25 times the preceding 20 sessions excluding the latest day; XLE was 0.99x, so it fails. The premium is an inference from dated supply events plus prices, not a measured decomposition of barrels lost. IEA October report: https://www.iea.org/reports/oil-market-report-october-2026 (the IEA page blocks automated fetch; the same figures are quoted at https://energynewsbeat.co/crude-oil/oil-over-100-as-markets-struggle-to-balance-amid-tanker-attacks-and-shipping-disruptions).
  Goldman''s Brent view is a secondary report: https://discoveryalert.com/news/oil-prices-houthi-strikes-saudi-brent-october-2026 .'
