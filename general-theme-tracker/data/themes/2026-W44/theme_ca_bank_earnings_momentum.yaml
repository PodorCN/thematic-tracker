explainer: 'Snapshot uses October 27 Toronto closes (16:00 ET, 20:00 UTC). Price Return uses Yahoo quote.close for ZEB.TO and the S&P/TSX Composite, split adjusted and excluding distributions; both legs use the same common sessions. 1W anchors October 20, 1M September 25, YTD December 31, 2025. ZEB is equal weighted, so it is not the cap-weighted bank exposure in the TSX. Volume confirmation requires at least 1.25 times the preceding 20 sessions excluding the latest day; ZEB was 0.35x, so it fails. A policy rate affects bank margins through asset repricing and funding costs, and credit losses through borrower stress; the link here is an inference from the rate-pricing data, not a reported margin change. Source for the rate decision: https://www.bankofcanada.ca/core-functions/monetary-policy/key-interest-rate/ .'
