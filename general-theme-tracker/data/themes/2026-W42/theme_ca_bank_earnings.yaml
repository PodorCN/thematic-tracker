depends_on:
  - event_name: BoC business and consumer surveys
    due_date: "2026-10-19"
    why_matters: >-
      Official survey release tests demand and investment expectations:
      https://www.bankofcanada.ca/press/upcoming-events/
    if_bull: Firmer demand and stable credit intentions support the earnings outlook
    if_bear: Weaker hiring and spending intentions raise credit-demand concerns
  - event_name: BoC decision and Monetary Policy Report
    due_date: "2026-10-28"
    why_matters: >-
      Official schedule; growth and inflation jointly affect margins and credit:
      https://www.bankofcanada.ca/2025/08/bank-canada-publishes-2026-schedule-policy-interest-rate-announcements-other-major-publications/
    if_bull: A stable policy path and resilient growth support earnings visibility
    if_bear: A weaker growth outlook or disruptive inflation raises credit and valuation risk
  - event_name: RBC fiscal Q4 results (confirmed)
    due_date: "2026-12-03"
    why_matters: >-
      RBC issuer reporting calendar, not an estimate for every bank:
      https://www.rbc.com/investor-relations/financial-information.html
    if_bull: Stable provisions, loan growth and margins validate a recovery
    if_bear: Higher provisions or weaker guidance undermine the earnings case
