week: 2026-W42
title: "Canadian Banks: Recovery Needs Proof"
status: Fading
status_note: >-
  Still Fading: ZEB recovered 1.94% in a week but lagged TSX over a month; employment weakness tests credit
  quality.
conviction: Low
horizon: Cyclical 3-12m
created_at: "2026-08-27"
updated_at: "2026-10-15"
data_quality: production
summary: >-
  Canadian banks show a weekly repair, not a verified restart of the earnings trade. ZEB gained +1.94% in one
  week against +1.55% for the TSX, but its -2.24% one-month return lagged the index's -0.33%. Canada's October
  9 employment report raised credit-demand questions. October 19 Bank of Canada surveys, the October 28
  decision and RBC's confirmed December 3 results provide the next evidence. Status remains Fading and
  conviction Low.
body_text: >-
  ZEB closed at C$74.55 on September 14, C$71.49 on October 7 and C$72.88 on October 14. One-week repair of
  1.94% beat the TSX's 1.55%, but the one-month decline of 2.24% lagged the index's 0.33% loss. RBC, TD and
  BMO each advanced over the latest week; that is breadth in a rebound, not a new earnings beat.

  Statistics Canada's October 9 release reported 68,000 fewer jobs and 6.5% unemployment in September. Weaker
  employment could reduce loan demand or raise credit costs; that is a risk channel, not measured
  deterioration in bank provisions. The old earnings-momentum expectation therefore still lacks a fresh
  fundamental confirmation.

  Status remains Fading with Low conviction. October 19 business and consumer surveys and the October 28 BoC
  decision test the growth backdrop. RBC confirms December 3 for its next results. Better credit outcomes and
  durable relative gains would strengthen the case; rising provisions or persistent monthly underperformance
  would weaken it.
chain:
  - when: Sep 14
    label: Banks started the monthly window at a higher price
    detail: ZEB, a fund holding major Canadian banks, closed at C$74.55.
  - when: Oct 7-9
    label: Prices weakened and employment created another risk
    detail: ZEB closed at C$71.49 on October 7. The October 9 labour report showed an employment decline of 68,000.
  - when: Oct 14
    label: The rebound still needs earnings evidence
    detail: >-
      ZEB recovered to C$72.88 but remained below its September price. A weekly recovery does not establish
      improving credit quality.
explainer: >-
  Snapshot refreshed October 15 before the US/Canada close. Performance and charts stop at October 14, 20:00
  UTC; October 15 news is identified separately and has no completed US-session reaction yet. Price Return
  uses Yahoo quote.close: split adjusted, no cash-distribution reinvestment. 1W anchors October 7; 1M
  September 14; YTD December 31, 2025. Benchmarks use the same dates. Series rebase each common session to 100
  on August 3. A lower long-bond price means a higher yield, so TLT returns must not be inverted in the table.
  Volume confirmation requires thesis-direction price confirmation plus latest volume at least 1.25 times the
  preceding 20 sessions, excluding the latest day. All bank and TSX returns are in CAD with no FX conversion.
  Canadian markets were closed October 12 for Thanksgiving; the inner-joined chart excludes it, while US
  charts retain it. ZEB latest volume was 1.38x the preceding 20 sessions, but volume_confirm remains false
  because monthly relative-price confirmation is absent. Breadth is measured from positive October 7-14 RY.TO,
  TD.TO and BMO.TO returns. No new provision or margin figure is asserted. Labour source:
  https://www150.statcan.gc.ca/n1/daily-quotidien/261009/dq261009a-eng.htm .
