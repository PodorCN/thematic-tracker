week: 2026-W42
title: "AI Capex: Demand Versus Funding Costs"
status: Fading
status_note: >-
  Downgraded to Fading: QQQ lost 3.80% in a week; demand evidence remains, but bullish price confirmation
  weakened.
conviction: Med
horizon: Cyclical 3-12m
created_at: "2026-07-06"
updated_at: "2026-10-15"
data_quality: production
summary: >-
  The AI spending story now faces a financing test. QQQ returned -3.80% over one week versus -1.06% for the
  S&P 500 (-2.74pp excess), despite remaining ahead over one month. October 14 inflation coincided with broad
  technology weakness. ASML still reports firm demand. Today's PPI adds inflation risk, but its US
  closing-price response is unavailable. Fading means price confirmation weakened; it does not establish that
  AI investment has collapsed.
body_text: >-
  QQQ closed at $756.20 on October 5, then fell to $747.58 on October 8 and $728.95 on October 14. The last
  session lost 1.97% versus the S&P 500's 1.11% decline; Nvidia, Broadcom and AMD also fell. That weakens the
  idea that AI demand alone can protect expensive growth shares.

  The October 14 BLS release put headline inflation at 3.7% yearly. Higher financing costs are a plausible
  pressure on data-center investment, not a measured cause of the decline. ASML's October 14 results describe
  firm equipment demand, countering a demand-collapse narrative. Today's PPI release adds inflation risk but
  has no completed US closing-price response yet.

  The marginal change is from unconditional spending optimism to scrutiny of funding and cash returns.
  Conviction is Med and status Fading. Watch the October 28 FOMC and November 10 CPI: sustained relative
  recovery plus intact customer spending would restore confirmation; funding stress and weaker orders would
  damage the thesis.
chain:
  - when: Oct 5
    label: Technology began the period with a stronger closing price
    detail: QQQ, a fund tracking major Nasdaq companies, closed at $756.20.
  - when: Oct 8
    label: The fund began giving back those gains
    detail: QQQ closed at $747.58. A lower price began challenging the earlier optimism.
  - when: Oct 14-15
    label: Inflation pressure now competes with chip demand
    detail: >-
      QQQ fell to $728.95 after CPI. ASML reported firm equipment demand; today PPI added inflation risk, with
      its closing reaction still unknown.
explainer: >-
  Snapshot refreshed October 15 before the US/Canada close. Performance and charts stop at October 14, 20:00
  UTC; October 15 news is identified separately and has no completed US-session reaction yet. Price Return
  uses Yahoo quote.close: split adjusted, no cash-distribution reinvestment. 1W anchors October 7; 1M
  September 14; YTD December 31, 2025. Benchmarks use the same dates. Series rebase each common session to 100
  on August 3. A lower long-bond price means a higher yield, so TLT returns must not be inverted in the table.
  Volume confirmation requires thesis-direction price confirmation plus latest volume at least 1.25 times the
  preceding 20 sessions, excluding the latest day. QQQ is a concentrated growth-stock proxy, not a pure AI
  capital-expenditure index. Breadth confirmation is false: the measured October 14 moves in NVDA, AVGO and
  AMD were negative. Volume ratio was 1.52x, but downside volume is not confirmation of a bullish capex
  thesis. Today PPI: https://www.bls.gov/news.release/ppi.nr0.htm . ASML:
  https://investor.asml.com/news-releases/news-release-details/asml-reports-eu11.7-billion-total-net-sales-and-eu5.0-billion-net-income-q3-2026
  .
