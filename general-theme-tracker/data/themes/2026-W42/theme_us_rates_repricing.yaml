    why_matters: >-
      Cases refer to the higher-yield thesis, not a long TLT holding. Official meeting calendar:
      https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    if_bull: Renewed yield highs and falling TLT would revive the higher-yield thesis
    if_bear: Lower yields and a stronger TLT keep the thesis Fading; sustained sub-5% 10Y further weakens it
  - event_name: "October CPI: bond-market response"
    due_date: "2026-11-10T13:30:00Z"
