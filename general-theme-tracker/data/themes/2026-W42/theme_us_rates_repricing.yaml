      Direction matters: long TLT gains oppose the higher-yield thesis. Official release schedule:
      https://www.bls.gov/news.release/archives/cpi_10142026.htm
    if_bull: Persistent inflation followed by rising long yields and falling TLT would restore price confirmation
    if_bear: Softer inflation or another TLT rally despite hot data keeps price confirmation absent
