data_quality: production
summary: >-
  The earlier rising-yield thesis has lost near-term price confirmation. TLT returned +2.26% in one week
  versus -1.06% for the S&P 500; the 10-year yield eased from 5.311% on October 5 to 5.190% on October 14.
  Inflation is still a risk, and today's PPI reinforces it, but hot data has not yet produced another
  sustained bond selloff. Status is Fading, with the next FOMC decision the main test.
body_text: >-
  The October 5 observation was a 5.311% 10-year yield and a $77.11 TLT close. By October 8 TLT was $77.87; on
  October 14 it reached $78.89 as the yield eased to 5.190%. TLT gained 2.26% over one week, although its
  one-month return remained negative.

  October 14 CPI raised the inflation concern, yet bonds rallied that session. Today's October 15 PPI release
  adds a 1.3% monthly and 6.3% yearly increase in final-demand producer prices; no completed US closing
  reaction is available for it yet. The divergence prevents a claim that higher inflation mechanically means
  higher long yields every day.

  The prior expectation was a persistent long-bond selloff; the marginal evidence is a rebound. Status moves
  to Fading, conviction Med. A lower TLT price would confirm the higher-yield direction; its returns are shown
  without sign inversion. The October 28 FOMC and November 10 CPI are the tests. A sustained yield break below
  5% would further weaken the thesis; renewed highs would revive it.
chain:
  - when: Oct 5
    label: Long-term borrowing costs were elevated
    detail: The 10-year Treasury yield was 5.311%, and TLT, a fund of long-term Treasury bonds, closed at $77.11.
  - when: Oct 8
    label: Long bonds started to recover
    detail: TLT closed at $77.87. Rising bond prices weaken a thesis based on a continuing bond selloff.
  - when: Oct 14-15
    label: Bonds recovered despite renewed inflation concerns
    detail: >-
      TLT reached $78.89 and the yield eased to 5.190% after CPI. Today PPI added inflation risk, with its
      closing reaction still unknown.
explainer: >-
  Snapshot refreshed October 15 before the US/Canada close. Performance and charts stop at October 14, 20:00
  UTC; October 15 news is identified separately and has no completed US-session reaction yet. Price Return
  uses Yahoo quote.close: split adjusted, no cash-distribution reinvestment. 1W anchors October 7; 1M
  September 14; YTD December 31, 2025. Benchmarks use the same dates. Series rebase each common session to 100
  on August 3. A lower long-bond price means a higher yield, so TLT returns must not be inverted in the table.
  Volume confirmation requires thesis-direction price confirmation plus latest volume at least 1.25 times the
  preceding 20 sessions, excluding the latest day. TLT is long duration; a bearish bond thesis benefits from a
  falling proxy, unlike a bullish stock thesis. SPX is only cross-asset opportunity-cost context, not an
  interest-rate benchmark. The 10-year yield fell 2.7 basis points on Oct 14 (5.217% to 5.190%); this is a
  yield change, not a bond return. No unsupported decomposition into term premium versus policy expectations
  is claimed. Today PPI: https://www.bls.gov/news.release/ppi.nr0.htm .
