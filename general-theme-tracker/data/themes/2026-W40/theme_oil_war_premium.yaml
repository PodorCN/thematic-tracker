body_text: |
  年初市场 price-in 的是「2026 供给过剩」，WTI 去年 12 月还在 $55。9 月起美伊冲突升级——美军击沉伊朗油轮、
  沙特东西管线与 Yanbu 出口遇袭——WTI 一度突破 $100，战争溢价取代过剩叙事成为定价主线。
  当前 $91 的位置是多空拉锯的结果：实物端依旧紧（美国商业库存低于五年均值、曲线深度 backwardation、
  沙特出口仅部分恢复），但 G7 已示意释放应急柴油与原油储备、需求预测被 OPEC 与 IEA 双双下修，
  每一次外交进展头条都触发急跌。So What：这不是需求驱动的大宗周期，而是地缘供给冲击，
  交易表达应集中在上游权重高的能源股而非原油期货本身（展期成本高、回撤剧烈）。
  What Next：10 月 4 日 OPEC+ 会议（11 月配额）与每周 EIA 库存是高频验证点；
  若 Hormuz 通行量持续恢复 + 美伊谈判落地，溢价将快速回吐。

explainer: |
  Backwardation（现货升水）= 近月合约价格高于远月，表明实物紧张。本轮 11 月 WTI 对 12 月升水约 $3.7。
  战争溢价（war premium）指价格中由地缘风险贡献的部分，历史上在供应恢复后回吐速度快。
  收益均为 Price Return 口径，XLE 为美股能源板块 ETF（约 91% 为油气公司），不直接跟踪油价。

