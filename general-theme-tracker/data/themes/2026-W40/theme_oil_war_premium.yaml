body_text: |
  The market came into 2026 priced for "oversupply," with WTI still at $55 last December. Since September the
  US-Iran confrontation has escalated — US forces sank Iranian tankers, Saudi Arabia's East-West pipeline and
  Yanbu exports were hit — and WTI broke above $100: war premium replaced oversupply as the pricing script. The
  current $91 reflects a tug-of-war: physical markets remain tight (US commercial stocks below the five-year
  average, a deeply backwardated curve, Saudi exports only partly restored), but the G7 has signaled emergency
  diesel and crude releases, OPEC and the IEA both cut demand forecasts, and every diplomatic-progress headline
  triggers a sharp drop. So what: this is not a demand-driven commodity cycle but a geopolitical supply shock —
  exposure belongs in upstream-heavy energy equities, not crude futures themselves (high roll costs, violent
  drawdowns). What next: the Oct 4 OPEC+ meeting (November quotas) and weekly EIA stocks are the
  high-frequency checkpoints; if Hormuz flows keep recovering and US-Iran talks land, the premium unwinds fast.

explainer: |
  Backwardation = front-month contracts priced above deferred months, signaling physical tightness. This round,
  November WTI trades about $3.7 above December. War premium = the geopolitics-driven slice of the price;
  history shows it unwinds fast once supply recovers. All returns are Price Return; XLE is the US energy-sector
  ETF (about 91% oil & gas companies), not a crude tracker.

