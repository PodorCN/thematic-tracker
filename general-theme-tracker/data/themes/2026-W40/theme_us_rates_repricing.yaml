body_text: |
  9 月 4 日以来 10Y 从 4.78% 一路上行至 5.29%——2002 年以来首次。这轮抛售分两段：前半段由 2 年期领涨
  （Warsh 执掌的 Fed 9 月 16 日加息 25bp，点阵图转鹰），后半段长端自己接力，即便 8 月 PCE 回落至 3.4%
  也未能阻止——说明驱动已从政策预期切换到期限溢价与供给。周五非农仅 +2.9 万（预期 +8.5 万），
  10 月加息概率从 64% 砸到 25% 以下，但 10Y 盘中先跌后涨收于 5.28%：弱就业也压不住长端，
  这是本 Theme 最强的确认信号。So What：交易表达是做空久期（TLT 本周 -1.9%、YTD -8.7%），
  高利率同时压制利率敏感板块（公用事业 XLU 1M -6%），并抬高所有风险资产的贴现率。
  What Next：10 月 27-28 日 FOMC 是关键验证点；高盛已把下一次加息预期推到 12 月，
  若长端在暂停加息下仍创新高，「higher-for-longer + 期限溢价」叙事将完全确立。

explainer: |
  期限溢价（term premium）= 投资者持有长期债券要求的额外补偿，与政策预期无关，
  通常由供给（发债量）、通胀不确定性与海外需求决定。本页 TLT 收益为 Price Return 口径；
  该 Theme 的盈利表达是做空 TLT 或缩短组合久期，表中展示的是 TLT 自身表现。

