body_text: |
  Since Sep 4 the 10Y has climbed from 4.78% to 5.29% — the first time since 2002. The selloff came in two
  legs: the front end led first (the Warsh Fed hiked 25bp on Sep 16 and the dot plot turned hawkish), then the
  long end took over on its own — even soft August PCE at 3.4% could not stop it, a sign the driver has shifted
  from policy expectations to term premium and supply. Friday's payrolls printed just +29k (vs +85k expected),
  crushing October hike odds from 64% to below 25%, yet the 10Y dipped then rallied back to 5.28%: even weak
  jobs cannot hold down the long end — the strongest confirmation of this theme. So what: the trade expression
  is short duration (TLT -1.9% this week, -8.7% YTD); high rates simultaneously punish rate-sensitive sectors
  (utilities XLU -6% in 1M) and raise the discount rate on all risk assets. What next: the Oct 27-28 FOMC is the
  key checkpoint; Goldman has pushed its next-hike call to December — if the long end makes new highs even as
  hikes pause, the "higher-for-longer plus term premium" narrative is fully established.

explainer: |
  Term premium = the extra compensation investors demand for holding long bonds, unrelated to policy
  expectations; typically driven by supply (issuance), inflation uncertainty, and foreign demand. TLT returns
  on this page are Price Return; the way to trade this theme is short TLT or shortening portfolio duration —
  the table shows TLT itself.

