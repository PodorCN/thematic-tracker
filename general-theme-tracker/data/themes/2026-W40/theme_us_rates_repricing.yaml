    due_date: "2026-10-14T12:30:00Z"
    why_matters: August PCE at 3.4% is clouded by methodology tweaks; CPI is the cleaner inflation read
    if_bull: Core CPI m/m at or below 0.2% and the long end stabilizes → repricing pauses
    if_bear: Inflation rebounds → selloff deepens, theme strengthens
  - event_name: December FOMC (Goldman's hike call)
    due_date: "2026-12-16"
    why_matters: An actual December hike would fully deliver higher-for-longer
    if_bull: No hike and the long end retreats → theme gradually exits
    if_bear: Hike → theme upgraded to Cyclical

