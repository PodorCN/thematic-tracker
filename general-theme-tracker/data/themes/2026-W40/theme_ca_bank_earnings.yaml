body_text: |
  All Big Six Q3 reports (Aug 25-27) beat: RBC posted record $6B net income (+11%) with 17.9% ROE; TD also set
  records with 14.3% CET1, management hinting over $13B could be returned to shareholders by 2027. But the mix
  flatters — the beats came mostly from wealth management, capital markets, and trading income (RBC wealth +16%,
  TD wholesale banking net income +87%, RBC in the SpaceX IPO underwriting syndicate), while domestic
  personal-banking loan growth was soft and analysts flagged RBC's segment as "slightly light." The sector's
  forward valuation is the richest since 2010; First Avenue and others began trimming RY/TD/BMO in September,
  and ZEB fell 2.2% this week. So what: the earnings momentum is real, but the price already reflects it — the
  excess-return phase is most likely over, shifting from "buy" to "hold and watch." What next: early-December Q4
  results must answer two questions — whether personal-banking credit revives and whether provisions keep
  climbing (RBC Q3 provisions already +14%); tariff fallout on cross-border commercial lending is the tail risk.

explainer: |
  CET1 (common equity tier 1 ratio): the higher it is, the more excess capital is available for buybacks and
  dividends. TD targets 13% by 2027; at 14.3% today that implies $13B+ of potential returns. ZEB is the
  equal-weight Big Six ETF; returns are Price Return — with Canadian bank dividend yields around 2.8-3%,
  Total Return would read higher.

