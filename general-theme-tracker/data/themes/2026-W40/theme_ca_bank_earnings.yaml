body_text: |
  8 月 25-27 日六大行 Q3 财报全部超预期：RBC 净利润创纪录 $60 亿（+11%）、ROE 17.9%；
  TD 创纪录且 CET1 14.3%，管理层暗示到 2027 年可向股东返还超 $130 亿。但拆解结构后成色打折——
  超预期主要来自财富管理、资本市场与交易收入（RBC 财富收入 +16%、TD 批发银行净利 +87%、
  RBC 参与 SpaceX IPO 承销团），而本土个人银行信贷增长偏弱，分析师已指出 RBC 该板块「略轻」。
  板块前瞻估值为 2010 年以来最贵，First Avenue 等机构 9 月开始减持 RY/TD/BMO，ZEB 本周 -2.2%。
  So What：盈利动能是真的，但价格已充分定价，超额收益阶段大概率结束，从「做多」转为「持有观察」。
  What Next：12 月初 Q4 财报看两点——个人银行信贷是否回暖、拨备是否抬头（Q3 RBC 拨备已 +14%）；
  关税对跨境商业信贷的影响是尾部风险。

explainer: |
  CET1（核心一级资本充足率）越高，可用于回购/分红的冗余资本越多。TD 目标 2027 年回到 13%，
  当前 14.3% 意味着约 $130 亿+ 的潜在返还空间。ZEB 为等权重六大行 ETF；收益为 Price Return 口径，
  加拿大银行股股息率 ~2.8-3%，Total Return 口径会更高。

