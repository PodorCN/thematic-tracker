body_text: |
  AI 资本开支是 2026 年美股最持久的单一叙事：NDX YTD +21%，10 月 2 日收盘创纪录 30,808，
  NVDA 市值 $5.72 万亿。与上半年不同，边际变化有三：一是融资结构——Barclays 估算 hyperscaler
  今年发债约 $2,000 亿投入数据中心，capex 从「自有现金流」升级为「杠杆驱动」，链条拉长但脆弱性上升；
  二是估值已先行消化——NDX 前瞻市盈率 21.7x，较 2026 年高点回落 14%，盈利兑现接棒估值扩张；
  三是宏观配合——9 月非农爆冷后 10 月加息概率降至 25% 以下，贴现率压力暂缓。
  So What：主线仍在，但从「买预期」进入「验收入」阶段，持仓应向有订单与收入的芯片/基建环节集中。
  What Next：10 月底起 hyperscaler Q3 财报的资本开支指引是总开关；任何一家下修都会触发链条重估。

explainer: |
  Hyperscaler 指自建超大规模数据中心的云厂商。NDX 21.7x 为前瞻市盈率（Citadel Securities 数据）。
  半导体行业协会预期 2026 年全球芯片销售额 $1.51 万亿（+90%），2027 年 $1.9 万亿（+27%）。
  收益为 Price Return 口径；QQQ 跟踪 Nasdaq-100，不含股息。

