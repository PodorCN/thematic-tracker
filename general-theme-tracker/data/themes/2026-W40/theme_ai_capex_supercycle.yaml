body_text: |
  AI capex is 2026's most durable US equity narrative: NDX +21% YTD with a record close of 30,808 on Oct 2,
  and NVDA worth $5.72T. Three marginal changes versus H1: first, funding structure — Barclays estimates
  hyperscalers will issue roughly $200B in debt this year for data centers, upgrading capex from "self-funded
  cash flow" to "leverage-driven": a longer chain, but a more fragile one; second, valuation already digested —
  NDX forward P/E of 21.7x, down 14% from the 2026 high, with earnings delivery taking over from multiple
  expansion; third, macro cooperation — after the soft September payrolls, October hike odds fell below 25%
  and discount-rate pressure eased. So what: the main line holds, but the phase has shifted from "buy the
  expectation" to "verify the revenue" — exposure belongs in chips and infrastructure links with orders and
  revenue. What next: hyperscaler Q3 capex guidance from late October is the master switch; any cut triggers
  a chain-wide repricing.

explainer: |
  Hyperscaler = cloud vendors building their own hyperscale data centers. NDX 21.7x is forward P/E
  (Citadel Securities). The semiconductor industry association expects 2026 global chip sales of $1.51T (+90%)
  and $1.9T in 2027 (+27%). Returns are Price Return; QQQ tracks the Nasdaq-100 excluding dividends.

