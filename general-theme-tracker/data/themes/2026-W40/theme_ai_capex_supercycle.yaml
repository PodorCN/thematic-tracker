  cash flow to $200B of debt-funded build — a longer but more fragile chain; the NDX multiple digested to
  21.7x, down 14% from the high, shifting the burden to earnings; then soft September payrolls crushed
  October hike odds below 25%, and Friday closed the loop with NVDA at $237.87 and a record Nasdaq 100.
  Proxy versus benchmark reads QQQ +0.7% against SPX -0.3% over one week and +5.8% versus +0.7% over one
  month. So what: favor order-backed chips into late-October capex guidance.

